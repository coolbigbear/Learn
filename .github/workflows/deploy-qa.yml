name: Deploy QA

on:
  push:
    branches:
      - QA

concurrency:
  group: qa-deploy
  cancel-in-progress: true

jobs:
  deploy-qa:
    name: Build & Deploy to QA
    runs-on: [self-hosted, linux, arm64, pi]

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: QA

      - name: Build Docker image
        run: |
          docker compose build qa

      - name: Deploy QA service
        run: |
          docker rm -f python-tutorials-qa 2>/dev/null || true
          docker compose up -d qa

      - name: Health check — wait for API to be ready
        run: |
          echo "Waiting for QA API to be healthy..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8081/api/health > /dev/null 2>&1; then
              echo "✅ QA is healthy after ~${i}s"
              exit 0
            fi
            echo "Attempt $i/12 — not ready, waiting 5s..."
            sleep 5
          done
          echo "❌ QA failed to become healthy within 60 seconds"
          docker logs python-tutorials-qa --tail 30
          exit 1
