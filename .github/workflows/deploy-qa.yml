name: Deploy QA

on:
  push:
    branches:
      - QA

concurrency:
  group: qa-deploy
  cancel-in-progress: true

jobs:
  deploy-qa:
    name: Build & Deploy to QA
    runs-on: [self-hosted, linux, arm64, pi]

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: QA

      - name: Build sandbox image (exercise execution runtime)
        run: |
          echo "Building tutorial-runner-python:latest (sandbox for exercise execution)..."
          docker build -t tutorial-runner-python:latest api/docker/images/python

      - name: Build Docker image
        run: |
          docker compose build qa

      - name: Deploy QA service
        run: |
          docker rm -f python-tutorials-qa 2>/dev/null || true
          docker compose up -d qa

      - name: Health check — wait for API to be ready
        run: |
          echo "Waiting for QA API to be healthy (via Docker HEALTHCHECK)..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect python-tutorials-qa --format '{{.State.Health.Status}}' 2>/dev/null)
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ QA is healthy after ~${i}s (Docker HEALTHCHECK: $STATUS)"
              docker exec python-tutorials-qa python -c "import urllib.request; r=urllib.request.urlopen('http://localhost:8080/api/health',timeout=5); print(f'API responds: HTTP {r.status}')" 2>/dev/null || true
              exit 0
            fi
            echo "Attempt $i/24 — status=$STATUS, waiting 5s..."
            sleep 5
          done
          echo "❌ QA failed to become healthy within 120 seconds"
          docker inspect python-tutorials-qa --format 'Status: {{.State.Status}}, Health: {{.State.Health.Status}}' 2>/dev/null || echo "Container not found"
          docker logs python-tutorials-qa --tail 50 2>/dev/null || true
          exit 1
