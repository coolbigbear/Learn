# =============================================================================
# Docker Compose — Multi-environment deployment
#
# Two services sharing the same image, separated by host port and DB volume:
#   qa   → port 8081 (configurable via $QA_PORT)
#   prod → port 8082 (configurable via $PROD_PORT)
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  NOTE: Port 8080 on this host is taken by a searxng service. The  ║
# ║  prod default is 8082 to avoid the conflict. Override with         ║
# ║  PROD_PORT env var if you need a different port.                   ║
# ╚══════════════════════════════════════════════════════════════════════╝
# =============================================================================

services:
  # ── QA environment ───────────────────────────────────────────────────────────
  qa:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-tutorials:latest
    container_name: python-tutorials-qa
    ports:
      - "${QA_PORT:-8081}:8080"
    environment:
      - PRODUCTION=1
      - DATABASE_URL=sqlite+aiosqlite:///./data/tutorials.db
      - ROOT_DIR=/app
      - FRONTEND_DIST=/app/frontend/dist
      - DOCKER_ENABLED=true
    volumes:
      - qa-db:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── Production environment ───────────────────────────────────────────────────
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-tutorials:latest
    container_name: python-tutorials-prod
    ports:
      - "${PROD_PORT:-8082}:8080"
    environment:
      - PRODUCTION=1
      - DATABASE_URL=sqlite+aiosqlite:///./data/tutorials.db
      - ROOT_DIR=/app
      - FRONTEND_DIST=/app/frontend/dist
      - DOCKER_ENABLED=true
    volumes:
      - prod-db:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── Self-hosted GitHub Actions Runner ─────────────────────────────────────────
  runner:
    image: myoung34/github-runner:latest
    container_name: github-runner-learn
    restart: unless-stopped
    environment:
      - REPO_URL=https://github.com/coolbigbear/Learn
      - RUNNER_NAME=pi2-qa-runner
      - RUNNER_TOKEN=AFSPESKYIUIKBENCY562SOTKL4TMI
      - RUNNER_WORKDIR=/tmp/runner-work
      - RUNNER_GROUP=default
      - LABELS=self-hosted,linux,arm64,pi
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner-work

# ── Named volumes for data isolation per environment ──────────────────────────
volumes:
  qa-db:
  prod-db:
  runner-work: